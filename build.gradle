plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

group = "stayablox.purpleevil"
version = '0.1'

repositories {
    mavenCentral()
    mavenLocal()
}

configurations {
    implementation.extendsFrom(library)
    shadow.extendsFrom(library)
}

dependencies {
    library "com.ferra13671:comet-renderer:${cometrenderer_version}"
    library "com.ferra13671:comet-renderer-better-compiler:${cometrenderer_version}"
    library "com.ferra13671:comet-renderer-glfw:${cometrenderer_version}"
    library "de.marhali:json5-java:${project.json5_version}"
    library "com.ferra13671:json-utils:${project.json_utils_version}"
    library "com.ferra13671:overtone:${project.overtone_version}"


    library platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    library "org.lwjgl:lwjgl"
    library "org.lwjgl:lwjgl-glfw"
    library "org.lwjgl:lwjgl-opengl"
    library "org.lwjgl:lwjgl-openal"
    library "org.lwjgl:lwjgl-stb"
    library "org.joml:joml:${jomlVersion}"

    def platforms = [
            'natives-windows', 'natives-windows-x86',
            'natives-macos', 'natives-macos-arm64',
            'natives-linux', 'natives-linux-arm64', 'natives-linux-arm32'
    ]
    platforms.each { platformName ->
        library group: 'org.lwjgl', name: 'lwjgl', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-glfw', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-opengl', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-openal', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-opengles', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-stb', classifier: platformName
    }

    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

jar {
    manifest {
        attributes 'Main-Class': 'stayablox.purpleevil.main.Main'
    }
}

shadowJar {
    configurations = [project.configurations.shadow]

    archiveClassifier.set('')
}

import java.nio.file.Paths

tasks.register('packageSingleExe') {
    dependsOn shadowJar

    doLast {
        // --- НАСТРОЙКИ ПРИЛОЖЕНИЯ ---
        def appName = project.name
        def mainClassName = "" // Пусто, так как Main-Class уже прописан в jar-манифесте
        def winRarPath = "C:\\Program Files\\WinRAR\\WinRAR.exe"

        // Иконка — должна лежать в ресурсах проекта. Используется для:
        //   1) jpackage --icon (иконка встроенного exe)
        //   2) WinRAR -iicon (иконка SFX-обёртки)
        def iconSource = file("${projectDir}/src/main/resources/window-icon.ico")

        // Куда сохранять финальный результат
        def finalOutputDir = "${project.layout.buildDirectory.get().asFile.absolutePath}/libs"
        file(finalOutputDir).mkdirs()
        // ------------------------------------------------

        // 1. Создаем временную папку в системном Temp
        def tempDir = file("${System.getProperty('java.io.tmpdir')}/jpackage-temp-${appName}-${System.currentTimeMillis()}")
        tempDir.mkdirs()

        try {
            println "=== Шаг 1: Подготовка временной директории ==="
            println "Рабочая папка: ${tempDir.absolutePath}"

            // Копируем shadowJar во временную папку
            def originalJar = shadowJar.archiveFile.get().asFile
            def tempJar = file("${tempDir.absolutePath}/${originalJar.name}")
            tempJar.bytes = originalJar.bytes

            def mainJarName = tempJar.name
            def inputDir = tempDir.absolutePath

            // Копируем иконку в temp под простым именем (без пробелов в пути —
            // WinRAR -iicon не парсит пути с пробелами).
            File sfxIcon = file("${tempDir.absolutePath}/app.ico")
            boolean hasIcon = iconSource.exists()
            if (hasIcon) {
                sfxIcon.bytes = iconSource.bytes
                println "Иконка скопирована: ${sfxIcon.absolutePath}"
            } else {
                println "WARN: Иконка не найдена по пути ${iconSource.absolutePath} — будет использована дефолтная"
            }

            def jpackageOutputDir = "${tempDir.absolutePath}/jpackage-out"
            def finalExeFile = file("${tempDir.absolutePath}/${appName}.exe")

            def javaHome = System.getProperty("java.home")
            def jpackagePath = Paths.get(javaHome, "bin", "jpackage.exe").toString()

            println "=== Шаг 2: Запуск jpackage ==="
            def jpackageArgs = [
                    '--input', inputDir,
                    '--name', appName,
                    '--main-jar', mainJarName,
                    '--type', 'app-image',
                    '--dest', jpackageOutputDir,
                    '--win-console'
            ]

            if (hasIcon) {
                jpackageArgs.add('--icon')
                jpackageArgs.add(sfxIcon.absolutePath)
            }

            if (mainClassName != null && !mainClassName.trim().isEmpty()) {
                jpackageArgs.add('--main-class')
                jpackageArgs.add(mainClassName)
            }

            providers.exec {
                commandLine jpackagePath
                args jpackageArgs
            }.result.get()

            println "=== Шаг 3: Создание sfx-options.txt ==="
            def sfxOptionsFile = file("${tempDir.absolutePath}/sfxoptions.txt")
            sfxOptionsFile.text = """Setup=${appName}.exe
TempMode
Silent=1
"""

            println "=== Шаг 4: Упаковка в монолитный .exe через WinRAR ==="
            def generatedAppFolder = "${jpackageOutputDir}/${appName}"

            if (file(winRarPath).exists()) {
                // Собираем команду WinRAR. Если есть иконка — добавляем -iicon,
                // чтобы SFX-обёртка тоже получила нашу иконку (а не стандартную WinRAR).
                List<String> rarArgs = [
                        winRarPath, 'a', '-sfx', '-ep1', '-r',
                        '-zsfxoptions.txt'
                ]
                if (hasIcon) {
                    rarArgs.add("-iicon${sfxIcon.absolutePath}")
                }
                rarArgs.add(finalExeFile.absolutePath)
                rarArgs.add("${generatedAppFolder}\\*")

                def rarResult = providers.exec {
                    workingDir = tempDir
                    commandLine rarArgs
                }.result.get()

                if (rarResult.exitValue != 0 && rarResult.exitValue != 1) {
                    throw new GradleException("WinRAR завершился с кодом ${rarResult.exitValue}.\n" +
                            "STDOUT: ${rarResult.standardOutput.asText.get()}\n" +
                            "STDERR: ${rarResult.standardError.asText.get()}")
                }

                // Копируем готовый exe обратно
                def finalDestination = file("${finalOutputDir}/${appName}.exe")
                finalDestination.bytes = finalExeFile.bytes
                println "\n УСПЕХ! Финальный файл собран и возвращен в: ${finalDestination.absolutePath}"
            } else {
                throw new GradleException("Ошибка: WinRAR не найден по пути: ${winRarPath}.")
            }

        } finally {
            println "=== Шаг 5: Очистка временных файлов ==="
            delete(tempDir)
        }
    }
}

build {
    finalizedBy shadowJar
}

shadowJar {
    finalizedBy tasks.getByName('packageSingleExe')
}