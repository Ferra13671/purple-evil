plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

group = "stayablox.purpleevil"
version = '1.1-post-jam'

repositories {
    mavenCentral()
    mavenLocal()
}

configurations {
    implementation.extendsFrom(library)
    shadow.extendsFrom(library)
}

dependencies {
    library platform("com.ferra13671:comet-renderer-bom:${cometrenderer_version}")
    library "com.ferra13671:comet-renderer"
    library "com.ferra13671:comet-renderer-better-compiler"
    library "com.ferra13671:comet-renderer-glfw"

    library "de.marhali:json5-java:${project.json5_version}"
    library "com.ferra13671:json-utils:${project.json_utils_version}"
    library "com.ferra13671:overtone:${project.overtone_version}"

    library platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    library "org.lwjgl:lwjgl"
    library "org.lwjgl:lwjgl-glfw"
    library "org.lwjgl:lwjgl-opengl"
    library "org.lwjgl:lwjgl-openal"
    library "org.lwjgl:lwjgl-stb"
    library "org.joml:joml:${jomlVersion}"

    def platforms = [
            'natives-windows', 'natives-windows-x86',
            'natives-macos', 'natives-macos-arm64',
            'natives-linux', 'natives-linux-arm64', 'natives-linux-arm32'
    ]
    platforms.each { platformName ->
        library group: 'org.lwjgl', name: 'lwjgl', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-glfw', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-opengl', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-openal', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-opengles', classifier: platformName
        library group: 'org.lwjgl', name: 'lwjgl-stb', classifier: platformName
    }

    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

jar {
    manifest {
        attributes 'Main-Class': 'stayablox.purpleevil.main.Main'
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set('')
}

import java.nio.file.Paths

// --- НОВАЯ ЗАДАЧА: Сборка через jlink + bat + WinRAR SFX ---
tasks.register('packageMonolithicExe') {
    dependsOn shadowJar

    doLast {
        def appName = project.name
        def winRarPath = "C:\\Program Files\\WinRAR\\WinRAR.exe"
        def iconSource = file("${projectDir}/src/main/resources/window-icon.ico")
        def finalOutputDir = "${project.layout.buildDirectory.get().asFile.absolutePath}/libs"

        // 1. Создаём временную директорию для сборки
        def tempDir = file("${System.getProperty('java.io.tmpdir')}/monolithic-build-${appName}-${System.currentTimeMillis()}")
        tempDir.mkdirs()

        try {
            println "=== Шаг 1: Подготовка JRE через jlink ==="
            def javaHome = System.getProperty("java.home")
            def jlinkPath = Paths.get(javaHome, "bin", "jlink.exe").toString()
            def customJreDir = file("${tempDir.absolutePath}/jre")

            // Список модулей, необходимых для LWJGL/GLFW и игры.
            // При необходимости добавьте другие (например, java.sql, java.naming).
            def modules = [
                    'java.base',
                    'java.desktop',
                    'java.logging',
                    'java.xml',
                    'jdk.unsupported'
            ].join(',')

            providers.exec {
                commandLine jlinkPath,
                        '--add-modules', modules,
                        '--output', customJreDir.absolutePath,
                        '--strip-debug',
                        '--no-header-files',
                        '--no-man-pages',
                        '--compress', '2'
            }.result.get()

            // 2. Копируем JAR и иконку во временную папку
            println "=== Шаг 2: Копирование JAR и иконки ==="
            def jarFile = shadowJar.archiveFile.get().asFile
            def targetJar = file("${tempDir.absolutePath}/${jarFile.name}")
            targetJar.bytes = jarFile.bytes

            def targetIcon = file("${tempDir.absolutePath}/app.ico")
            boolean hasIcon = iconSource.exists()
            if (hasIcon) {
                targetIcon.bytes = iconSource.bytes
            }

            // 3. Создаём .bat-файл для запуска
            println "=== Шаг 3: Создание .bat-файла ==="
            def batFile = file("${tempDir.absolutePath}/launch.bat")
            batFile.text = """@echo off
cd /d "%~dp0"
start "" "jre\\bin\\java.exe" -jar "${jarFile.name}"
"""
            // Используем start "" чтобы окно консоли не висело, если не нужен --win-console.
            // Если консоль нужна, уберите start "" и оставьте просто java.exe

            // 4. Создаём sfxoptions.txt для WinRAR
            println "=== Шаг 4: Настройка SFX-архива ==="
            def sfxOptionsFile = file("${tempDir.absolutePath}/sfxoptions.txt")
            sfxOptionsFile.text = """Setup=launch.bat
TempMode
Silent=1
Overwrite=1
"""
            // Setup=launch.bat указывает WinRAR SFX запустить этот bat-файл после распаковки.

            // 5. Упаковка через WinRAR
            println "=== Шаг 5: Упаковка в монолитный .exe ==="
            def finalExeFile = file("${finalOutputDir}/${appName}.exe")
            // Убедимся, что папка libs существует
            finalExeFile.parentFile.mkdirs()

            if (!file(winRarPath).exists()) {
                throw new GradleException("WinRAR не найден по пути: ${winRarPath}")
            }

            List<String> rarArgs = [
                    winRarPath, 'a', '-sfx', '-ep1', '-r',
                    '-zsfxoptions.txt'
            ]
            if (hasIcon) {
                rarArgs.add("-iicon${targetIcon.absolutePath}")
            }
            rarArgs.add(finalExeFile.absolutePath)
            // Добавляем ВСЁ содержимое временной папки, кроме самого sfxoptions.txt (он уже прочитан WinRAR)
            rarArgs.add("${tempDir.absolutePath}\\*")

            def rarResult = providers.exec {
                workingDir = tempDir
                commandLine rarArgs
            }.result.get()

            if (rarResult.exitValue != 0 && rarResult.exitValue != 1) {
                throw new GradleException("WinRAR завершился с кодом ${rarResult.exitValue}.\n" +
                        "STDOUT: ${rarResult.standardOutput.asText.get()}\n" +
                        "STDERR: ${rarResult.standardError.asText.get()}")
            }

            println "\n УСПЕХ! Монолитный .exe собран: ${finalExeFile.absolutePath}"
        } finally {
            println "=== Шаг 6: Очистка временных файлов ==="
            delete(tempDir)
        }
    }
}

build {
    finalizedBy shadowJar
}

shadowJar {
    finalizedBy tasks.getByName('packageMonolithicExe')
}